name: Docs

on:
  release:
    types: [published]
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, fileinfo, iconv, libxml, mbstring, phar, xml, xmlwriter

      - name: Determine version
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Download phpDocumentor
        run: curl -sL https://github.com/phpDocumentor/phpDocumentor/releases/latest/download/phpDocumentor.phar -o phpDocumentor.phar

      - name: Generate API docs
        run: |
          php phpDocumentor.phar run \
            -d sys \
            -t site/${{ steps.version.outputs.version }} \
            --title "phpEZ ${{ steps.version.outputs.version }}"

      - name: Checkout existing docs site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      # "latest" is a static redirect page rather than a copy/symlink, so it
      # survives peaceiris/actions-gh-pages' dereferencing copy untouched.
      - name: Assemble site
        run: |
          version="${{ steps.version.outputs.version }}"

          mkdir -p "site/latest"
          cat > site/latest/index.html <<EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=../${version}/">
          <script>location.replace('../${version}/');</script>
          <title>phpEZ documentation</title>
          </head>
          <body>
          <p>Redirecting to <a href="../${version}/">${version}</a>&hellip;</p>
          </body>
          </html>
          EOF

          versions=("$version")
          if [ -d gh-pages ]; then
            for d in gh-pages/*/; do
              name="$(basename "$d")"
              [ "$name" = "latest" ] && continue
              versions+=("$name")
            done
          fi
          mapfile -t versions < <(printf '%s\n' "${versions[@]}" | sort -Vru)

          version_list=""
          for v in "${versions[@]}"; do
            version_list+="    <li><a href=\"$v/\">$v</a></li>"$'\n'
          done

          template="gh-pages/index.html.template"
          if [ ! -f "$template" ]; then
            echo "::error::$template not found on gh-pages branch"
            exit 1
          fi

          awk -v latest="$version" -v list="$version_list" '
            { gsub(/\{\{LATEST_VERSION\}\}/, latest); gsub(/\{\{VERSION_LIST\}\}/, list); print }
          ' "$template" > site/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: true
